name: Deploy demo2 (secure-cloud-document-manager)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-demo2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/apps/secure-cloud-document-manager
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e backend/.env
            cd infrastructure
            # Build one at a time — this shared 1GB instance already hosts
            # several other apps' containers; building all services in
            # parallel caused severe swap-thrashing and timeouts on a
            # previous project here (see that project's deploy.yml comment).
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml build web
            docker compose -f docker-compose.prod.yml up -d
