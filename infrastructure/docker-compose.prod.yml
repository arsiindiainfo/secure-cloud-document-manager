# Production compose file — run on the EC2 server, NOT for local dev
# (use docker-compose.yml for local dev's mysql/localstack/mailhog).
#
# api uses the EC2 instance's IAM role for S3 access (no aws.key/aws.secret
# in backend/.env for production) and the shared native MySQL already
# running on this box (same pattern as the CRM app) — no mysql service here.
name: secure-cloud-document-manager-prod

services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: scdm-api
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - ../backend/.env
    # env_file only injects these as OS-level process env vars, which
    # turned out not to be visible to CodeIgniter during real request
    # handling under `spark serve` (confirmed via debug logging: getenv()
    # returned correct values via `docker exec`, but env()/$_SERVER/$_ENV
    # were all empty inside an actual HTTP request). CI4 also loads a
    # physical .env file itself (system/Boot.php's loadDotEnv(), into
    # $_SERVER/$_ENV) — mounting the real file at its expected path lets
    # that path do the job instead.
    volumes:
      - ../backend/.env:/var/www/backend/.env:ro

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web.prod
      args:
        VITE_API_BASE_URL: /api/v1
        # The invalid-input-response failures were most likely the same
        # root cause as the DB connection bug (env vars not visible to
        # CodeIgniter during real request handling) — restored now that
        # the .env mount fixes that. Also needs recaptcha.enabled=true in
        # backend/.env on the server (defaults false — see Config\Recaptcha).
        VITE_RECAPTCHA_SITE_KEY: "6LcOEaktAAAAAIP7mK_EKXiO7AGG6o_HTnaJReGb"
    container_name: scdm-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:80"
    depends_on: [api]
