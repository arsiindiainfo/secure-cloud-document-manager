server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same OWASP baseline as dev's nginx.web.conf, but pointed at the real
    # S3 bucket instead of LocalStack — direct browser<->S3 presigned
    # upload/download/preview traffic never goes through this origin or the
    # API, so it needs its own CSP allowance here (see nginx.web.conf's
    # comment — this is that "replace localhost:4566" step, done for prod).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://arsiindiainfo-secure-doc-manager-documents.s3.ap-south-2.amazonaws.com; frame-src 'self' https://arsiindiainfo-secure-doc-manager-documents.s3.ap-south-2.amazonaws.com; connect-src 'self' https://arsiindiainfo-secure-doc-manager-documents.s3.ap-south-2.amazonaws.com" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
