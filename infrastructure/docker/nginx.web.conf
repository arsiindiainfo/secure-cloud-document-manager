server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # §5/§25 hardening — the same OWASP baseline as the API's SecureHeaders
    # filter (app/Config/Filters.php), plus a CSP (meaningless on a JSON
    # API, but this is the actual HTML-serving origin, so it belongs here).
    # connect-src/img-src/frame-src include the LocalStack S3 endpoint
    # because presigned upload/download/preview URLs point straight at it
    # in local dev (§10) — replace localhost:4566 with the real bucket's
    # domain (or CloudFront) when deploying to AWS.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost:4566; frame-src 'self' http://localhost:4566; connect-src 'self' http://localhost:8082 http://localhost:4566" always;

    # SPA fallback — client-side router (react-router-dom) owns all paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
